<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASCII generator</title>
<style>
  /* Embedded on /play/ascii. Colors come in as ?bg=&ink= so it takes the
     page's dealt theme; standalone it falls back to white and charcoal. */
  @font-face { font-family: 'Social Condensed'; src: url('/fonts/trial/ABCSocialCondensed-Regular-Trial.woff2') format('woff2'); }
  :root { --bg: #FFFFFF; --ink: #2E2E2E; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 16px/1.2 'Social Condensed', 'Haas Grot Disp', sans-serif; letter-spacing: 0.17px;
    display: flex; flex-direction: column;
  }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 12px 14px; border-bottom: 1px solid color-mix(in srgb, var(--ink) 25%, transparent); }
  .seg { display: inline-flex; border: 1px solid var(--ink); border-radius: 4px; overflow: hidden; }
  .seg button { all: unset; cursor: pointer; padding: 4px 9px; font-size: 15px; }
  .seg button[aria-pressed='true'] { background: var(--ink); color: var(--bg); }
  label.range { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; }
  input[type=range] { accent-color: var(--ink); width: 110px; }
  .btn { all: unset; cursor: pointer; border: 1px solid var(--ink); border-radius: 4px; padding: 4px 9px; font-size: 15px; }
  .btn:active, .seg button:active { transform: scale(0.97); }
  .grow { flex: 1; }
  .stage { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 14px; overflow: hidden; }
  .stage.drag { outline: 2px dashed var(--ink); outline-offset: -10px; }
  canvas { max-width: 100%; max-height: 100%; image-rendering: auto; }
  .hint { margin: 0; padding: 0 14px 12px; font-size: 14px; opacity: 0.7; }
  @media (hover: hover) and (pointer: fine) { .btn:hover, .seg button:hover { opacity: 0.8; } }
</style>
</head>
<body>
  <div class="bar">
    <div class="seg" role="group" aria-label="Pattern">
      <button data-mode="ascii" aria-pressed="true">Type</button>
      <button data-mode="dots" aria-pressed="false">Dots</button>
    </div>
    <label class="range">Detail <input id="detail" type="range" min="40" max="160" value="110"></label>
    <label class="range">Invert <input id="invert" type="checkbox"></label>
    <span class="grow"></span>
    <button class="btn" id="pick">Use your photo</button>
    <button class="btn" id="save">Save PNG</button>
    <input id="file" type="file" accept="image/*" hidden>
  </div>
  <div class="stage" id="stage">
    <canvas id="out"></canvas>
  </div>
  <p class="hint">Or drop an image onto the frame. It never leaves your browser.</p>

<script>
  const q = new URLSearchParams(location.search)
  const root = document.documentElement
  if (q.get('bg')) root.style.setProperty('--bg', q.get('bg'))
  if (q.get('ink')) root.style.setProperty('--ink', q.get('ink'))
  const css = (v) => getComputedStyle(root).getPropertyValue(v).trim()

  const out = document.getElementById('out')
  const stage = document.getElementById('stage')
  const detail = document.getElementById('detail')
  const invert = document.getElementById('invert')
  const RAMP = '@%#*+=-:. '
  let mode = 'ascii'
  let img = new Image()
  img.onload = draw
  img.src = q.get('src') || 'default.jpg'

  function sample(cols, rows) {
    const c = document.createElement('canvas')
    c.width = cols; c.height = rows
    const x = c.getContext('2d', { willReadFrequently: true })
    x.drawImage(img, 0, 0, cols, rows)
    const d = x.getImageData(0, 0, cols, rows).data
    const lum = new Float32Array(cols * rows)
    for (let i = 0; i < lum.length; i++) lum[i] = (0.2126 * d[i * 4] + 0.7152 * d[i * 4 + 1] + 0.0722 * d[i * 4 + 2]) / 255
    // Auto-levels: stretch the 2nd to 98th percentile across the whole ramp,
    // so a flat, low-contrast photo still reads.
    const sorted = Float32Array.from(lum).sort()
    const lo = sorted[Math.floor(sorted.length * 0.02)], hi = sorted[Math.floor(sorted.length * 0.98)]
    const span = Math.max(0.05, hi - lo)
    for (let i = 0; i < lum.length; i++) {
      const v = Math.min(1, Math.max(0, (lum[i] - lo) / span))
      lum[i] = invert.checked ? 1 - v : v
    }
    return lum
  }

  function draw() {
    if (!img.naturalWidth) return
    const bg = css('--bg'), ink = css('--ink')
    const cols = +detail.value
    const dpr = Math.min(2, window.devicePixelRatio || 1)
    const boxW = stage.clientWidth - 28, boxH = stage.clientHeight - 28
    const aspect = img.naturalWidth / img.naturalHeight
    // Cell is square for dots; type cells are taller than wide (0.6).
    const cellAspect = mode === 'ascii' ? 0.6 : 1
    const rows = Math.max(1, Math.round((cols / aspect) * cellAspect))
    let w = boxW, h = (w / cols) * rows / cellAspect
    if (h > boxH) { h = boxH; w = (h * cellAspect / rows) * cols }
    out.width = Math.round(w * dpr); out.height = Math.round(h * dpr)
    out.style.width = w + 'px'; out.style.height = h + 'px'
    const ctx = out.getContext('2d')
    ctx.scale(dpr, dpr)
    ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h)
    ctx.fillStyle = ink
    const lum = sample(cols, rows)
    const cw = w / cols, ch = h / rows
    if (mode === 'ascii') {
      ctx.font = `${Math.min(ch, cw / 0.6)}px ui-monospace, 'SF Mono', Menlo, monospace`
      ctx.textBaseline = 'top'
      for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
        // Dark pixel, dense character: ink reads as the shadow.
        const ch_ = RAMP[Math.min(RAMP.length - 1, Math.floor(lum[y * cols + x] * RAMP.length))]
        if (ch_ !== ' ') ctx.fillText(ch_, x * cw, y * ch)
      }
    } else {
      for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
        const r = (1 - lum[y * cols + x]) * cw * 0.55
        if (r < 0.25) continue
        ctx.beginPath(); ctx.arc(x * cw + cw / 2, y * ch + ch / 2, r, 0, Math.PI * 2); ctx.fill()
      }
    }
  }

  document.querySelectorAll('[data-mode]').forEach((b) => b.addEventListener('click', () => {
    mode = b.dataset.mode
    document.querySelectorAll('[data-mode]').forEach((o) => o.setAttribute('aria-pressed', o === b))
    draw()
  }))
  detail.addEventListener('input', draw)
  invert.addEventListener('change', draw)
  new ResizeObserver(draw).observe(stage)

  const load = (f) => { if (f && f.type.startsWith('image/')) img.src = URL.createObjectURL(f) }
  document.getElementById('pick').onclick = () => document.getElementById('file').click()
  document.getElementById('file').onchange = (e) => load(e.target.files[0])
  stage.addEventListener('dragover', (e) => { e.preventDefault(); stage.classList.add('drag') })
  stage.addEventListener('dragleave', () => stage.classList.remove('drag'))
  stage.addEventListener('drop', (e) => { e.preventDefault(); stage.classList.remove('drag'); load(e.dataTransfer.files[0]) })
  document.getElementById('save').onclick = () => {
    const a = document.createElement('a')
    a.download = `ascii-${mode}.png`; a.href = out.toDataURL('image/png'); a.click()
  }
</script>
</body>
</html>
