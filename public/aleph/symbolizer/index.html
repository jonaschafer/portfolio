<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Symbolizer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Martian+Mono:wght@300;400&display=swap">
<style>
/* One dark workspace matching the Figma canvas: stage left, the piece's controls right. */
:root{--canvas:#2E2E2E;--panel:#242424;--line:#3D3D3D;--ink:#F2F2F2;--mute:#A3A3A3;--cut:#FF4B3E;--body:#7FB2FF;--guide:#E9BF42;--paper:#F4F4F2;--paper-ink:#1E1E1E;
--sans:'Geist',ui-sans-serif,system-ui,sans-serif;--mono:'Martian Mono',ui-monospace,Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--canvas);color:var(--ink);font:14px/1.4 var(--sans);-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:minmax(0,1fr) 340px;height:100%;min-height:640px}
.main{display:flex;flex-direction:column;min-width:0}
.head{display:flex;align-items:center;gap:16px;padding-block:12px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:14px;font-weight:600;margin:0}
.head p{margin:0;color:var(--mute);font-size:13px}
.push{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.stage{flex:1;min-height:320px;position:relative;touch-action:none;cursor:grab;overflow:hidden}
.stage.drag{cursor:grabbing}
.stage.light{background:var(--paper)}
#view{position:absolute;inset:0;width:100%;height:100%;display:block}
.hint{position:absolute;left:20px;bottom:14px;color:var(--mute);font:300 10px/1.5 var(--mono);pointer-events:none}
.stage.light .hint{color:#666}
.strip{display:flex;gap:28px;align-items:center;flex-wrap:wrap;padding-block:12px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:20px;border-top:1px solid var(--line)}
.sizes{display:flex;gap:16px;align-items:center}
.sizes.lt{background:var(--paper);padding:8px 12px;border-radius:4px}
.sizes span{display:block}
.pins{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto}
.pin{width:44px;height:44px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:4px;cursor:pointer}
.pin:hover{border-color:var(--ink)}
aside{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding-bottom:24px;padding-right:env(safe-area-inset-right,0px)}
section{padding:14px 16px;border-bottom:1px solid var(--line);display:grid;gap:10px}
h2{font:400 10px/1 var(--mono);letter-spacing:.06em;color:var(--mute);margin:0;display:flex;justify-content:space-between;align-items:center;text-transform:uppercase}
h2 .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}
.presets{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.preset{aspect-ratio:1;padding:7px;background:var(--canvas);border:1px solid var(--line);border-radius:4px;cursor:pointer}
.preset:hover{border-color:var(--mute)}.preset[aria-pressed=true]{border-color:var(--ink)}
.preset svg{width:100%;height:100%;display:block}
.row{display:grid;grid-template-columns:96px minmax(0,1fr) 66px;gap:8px;align-items:center}
.row label{color:var(--mute);font-size:13px}
input[type=range]{width:100%;accent-color:var(--ink);margin:0}
input[type=number]{width:100%;background:var(--canvas);color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:3px 5px;font:300 10px var(--mono);font-variant-numeric:tabular-nums}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{flex:1;background:none;border:0;color:var(--mute);padding:6px 4px;font:13px var(--sans);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:#1b1b1b}
.btn{background:none;border:1px solid var(--line);color:var(--ink);padding:6px 10px;border-radius:4px;font:13px var(--sans);cursor:pointer}
.btn:hover{border-color:var(--ink)}.btn.main-btn{background:var(--ink);color:#1b1b1b;border-color:var(--ink)}
.btn[aria-pressed=true]{border-color:var(--ink);background:#3a3a3a}
.check{display:flex;gap:8px;align-items:center;color:var(--mute);font-size:13px}
textarea{width:100%;height:84px;background:var(--canvas);color:var(--mute);border:1px solid var(--line);border-radius:4px;font:300 10px/1.5 var(--mono);padding:8px;resize:vertical}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.note{color:var(--mute);font-size:12px;margin:0}
:focus-visible{outline:2px solid var(--body);outline-offset:1px}
[data-cut-off=true] .cutctl{display:none}
@media (max-width:820px){.app{display:block;height:auto}.stage{height:62vw;min-height:280px;flex:none}aside{border-left:0;border-top:1px solid var(--line)}.pins{margin-left:0}}
</style>
<div class="app" id="app">
 <div class="main">
  <div class="head"><h1>Symbolizer</h1><p>One piece, placed at 0&deg;, 120&deg; and &minus;120&deg;. Change the piece and all three follow.</p>
   <div class="push"><button class="btn" id="tConstruct" aria-pressed="true">Construction</button><button class="btn" id="tLight" aria-pressed="false">Light</button></div></div>
  <div class="stage" id="stage"><svg id="view" viewBox="-145 -145 290 290" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Live symbol"></svg><div class="hint" id="hint"></div></div>
  <div class="strip"><div class="sizes" id="sDark"></div><div class="sizes lt" id="sLight"></div><div class="pins" id="pins"></div></div>
 </div>
 <aside id="panel"></aside>
</div>

<script>

function slider(id,label,val,min,max,step,on){

  if(o.type==='path'&&o.anchors)o.anchors.forEach((an,i)=>sec.append(slider(pre+'r'+i,'Round '+an.name.toLowerCase(),an.r,0,45,.5,v=>{an.r=v;presetIdx=-1})));
  FIELDS.filter(f=>applies(o,f[0])).forEach(([k,l,a,b,st])=>sec.append(slider(pre+k,o.type==='line'&&k==='rt'?'Corner':l,o[k],a,b,st,v=>{o[k]=v;presetIdx=-1})))}
function panel(){
  const P=$('panel');P.innerHTML='';
  const a=group('Start from your Figma pieces');const g=document.createElement('div');g.className='presets';
  PRESETS.forEach((p,i)=>{const b=document.createElement('button');b.className='preset';b.title=`${p.name} (Property ${p.from})`;b.setAttribute('aria-label',p.name);b.setAttribute('aria-pressed',i===presetIdx);b.append(thumb(config(p),'#F2F2F2'));b.onclick=()=>{S=config(p);presetIdx=i;panel();draw()};g.append(b)});a.append(g);P.append(a);
  const b=group('Piece','var(--body)');shapeCtl(b,S.body,'b');P.append(b);
  const c=group('Cut','var(--cut)');const lb=document.createElement('label');lb.className='check';lb.innerHTML=`<input type="checkbox" id="cutOn" ${S.cut.on?'checked':''}> Cut into the piece`;lb.firstChild.onchange=e=>{S.cut.on=e.target.checked;presetIdx=-1;panel();draw()};c.append(lb);
  if(S.cut.on)shapeCtl(c,S.cut,'c');P.append(c);
  const d=group('Spacing');
  d.append(slider('gap','Gap',S.gap,0,20,.25,v=>{S.gap=v}),slider('spread','From center',S.spread,-30,40,.5,v=>{S.spread=v}),slider('lean','Lean',S.lean,-45,45,1,v=>{S.lean=v}));
  const fl=document.createElement('label');fl.className='check';fl.innerHTML=`<input type="checkbox" id="flip" ${S.flip?'checked':''}> Tuck the other way`;fl.firstChild.onchange=e=>{S.flip=e.target.checked;draw()};d.append(fl);P.append(d);
  const e=group('Take it with you');e.innerHTML+=`<div class="btns"><button class="btn main-btn" id="copySvg">Copy SVG</button><button class="btn" id="dlSvg">Download SVG</button><button class="btn" id="dlPng">Download PNG</button><button class="btn" id="copyLink">Copy link</button><button class="btn" id="pin">Pin to compare</button><button class="btn" id="copySet">Copy settings</button></div><textarea id="out" readonly aria-label="SVG code"></textarea><p class="note">Paste the SVG into Figma with Cmd V. Copy link shares this exact version. Exports use the current light or dark color.</p><textarea id="load" aria-label="Paste settings" placeholder="Paste settings here" style="height:44px"></textarea>`;P.append(e);
  const fb=(btn,t)=>{const o=btn.textContent;btn.textContent=t;setTimeout(()=>btn.textContent=o,1200)};
  const copy=(txt,btn)=>{const f=()=>{$('out').value=txt;$('out').select();fb(btn,'Selected')};try{navigator.clipboard.writeText(txt).then(()=>fb(btn,'Copied'),f)}catch(_){f()}};
  $('copySvg').onclick=e=>copy(last.svg,e.target);$('copySet').onclick=e=>copy(JSON.stringify(S),e.target);
  const save=(blob,name)=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
  $('dlSvg').onclick=()=>save(new Blob([last.svg],{type:'image/svg+xml'}),'symbol.svg');
  $('dlPng').onclick=()=>{const k=2048/Math.max(last.w,last.h),c=document.createElement('canvas');c.width=Math.ceil(last.w*k);c.height=Math.ceil(last.h*k);const x=c.getContext('2d');x.scale(k,k);x.fillStyle=light?'#1E1E1E':'#FFFFFF';x.fill(new Path2D(last.nd),'evenodd');c.toBlob(b=>save(b,'symbol.png'),'image/png')};
  $('copyLink').onclick=e=>{const u=location.origin+location.pathname+'#'+btoa(encodeURIComponent(JSON.stringify(S)));history.replaceState(null,'',u);copy(u,e.target)};
  $('pin').onclick=()=>{pins.unshift(JSON.parse(JSON.stringify(S)));pins=pins.slice(0,6);savePins();drawPins()};
  $('load').oninput=e=>{try{const v=JSON.parse(e.target.value);if(v.body&&v.cut){S=v;presetIdx=-1;panel();draw()}}catch(_){}};
  syncOut()}
function compute(c){const {symbol}=buildSymbol(c);const b=symbol.bounds.clone(),d=symbol.pathData;const q=symbol.clone({insert:false});q.translate(new paper.Point(-b.x,-b.y));const nd=short(q.pathData);
  return {d,b,nd,w:rd(b.width),h:rd(b.height)}}
function thumb(c,fill){const m=compute(c),v=document.createElementNS(SVGNS,'svg');v.setAttribute('viewBox',`0 0 ${m.w} ${m.h}`);v.innerHTML=`<path fill="${fill}" fill-rule="evenodd" d="${m.nd}"/>`;return v}
function draw(){
  const m=compute(S);last=m;last.svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${m.w} ${m.h}" width="${m.w}" height="${m.h}"><path fill="${light?'#1E1E1E':'#FFFFFF'}" fill-rule="evenodd" d="${m.nd}"/></svg>`;
  const ink=light?'var(--paper-ink)':'var(--ink)';let ov='';
  if(construct){
    const B=placeAt(shape(S.body,0),0,S),C=S.cut.on?placeAt(shape(S.cut,S.gap),0,S):null;
    const line=[0,120,-120].map(a=>`<line x1="${PIVOT.x}" y1="${PIVOT.y}" x2="${PIVOT.x}" y2="${PIVOT.y-118}" transform="rotate(${-a} ${PIVOT.x} ${PIVOT.y})" stroke="#888" stroke-width=".35" stroke-dasharray="1.5 2"/><text x="${PIVOT.x-125*Math.sin(a*Math.PI/180)}" y="${PIVOT.y-125*Math.cos(a*Math.PI/180)+1.5}" text-anchor="middle" fill="#999" font-size="4" font-family="Martian Mono,monospace">${a===0?'0\u00B0':a>0?'120\u00B0':'\u2212120\u00B0'}</text>`).join('');
    ov=line+`<path d="${B.pathData}" fill="none" stroke="var(--body)" stroke-width="${target==='body'?.8:.45}"/>`+(C?`<path d="${C.pathData}" fill="none" stroke="var(--cut)" stroke-width="${target==='cut'?.8:.45}" stroke-dasharray="2.2 1.6"/>`:'')+`<circle cx="${PIVOT.x}" cy="${PIVOT.y}" r="1.4" fill="none" stroke="#bbb" stroke-width=".4"/>`;
    const gx0=PIVOT.x-150,gx1=PIVOT.x+150,gt=m.b.y,gb=m.b.y+m.b.height,gl=(y,lab)=>`<line x1="${gx0}" x2="${gx1}" y1="${y}" y2="${y}" stroke="var(--guide)" stroke-width=".35"/><text x="${gx0+3}" y="${y+(lab==='top'?-1.6:4.2)}" fill="var(--guide)" font-size="3.6" font-family="Martian Mono,monospace">${lab} ${rd(y-PIVOT.y)}</text>`;
    ov+=gl(gt,'top')+gl(gb,'bottom');
    if(S.body.type==='path'&&S.body.anchors)ov+=S.body.anchors.map(an=>{let q=anchorPt(S.body,an);if(S.body.rot)q=q.rotate(S.body.rot,new paper.Point(S.body.x+S.body.w/2,S.body.y+S.body.h/2));q=q.add(new paper.Point(0,-S.spread));if(S.lean)q=q.rotate(S.lean,new paper.Point(PIVOT.x,PIVOT.y-S.spread-44));return `<circle cx="${q.x}" cy="${q.y}" r="${an.r>0?1.8:1.3}" fill="${an.r>0?'var(--body)':'var(--canvas)'}" stroke="var(--body)" stroke-width=".6"><title>${an.name}</title></circle>`}).join('');
    if(S.body.type==='line')ov+=nodePts().map(q=>`<circle cx="${q.x}" cy="${q.y}" r="2" fill="var(--canvas)" stroke="var(--body)" stroke-width=".7"/>`).join('');
    B.remove();C&&C.remove()}
  $('view').innerHTML=`<g transform="translate(${-PIVOT.x} ${-PIVOT.y})"><path fill="${ink}" fill-rule="evenodd" d="${m.d}"/>${ov}</g>`;
  $('hint').textContent=`${m.w} \u00D7 ${m.h}  ${S.body.type==='line'&&construct?'Drag a point to reshape the line, or':'Drag to'} move the ${target==='cut'?'cut':'piece'}. Arrow keys nudge it.`;
  [['sDark','#F2F2F2'],['sLight','#1E1E1E']].forEach(([id,f])=>{const r=$(id);r.innerHTML='';[48,32,24,16].forEach(z=>{const s=document.createElement('span');s.style.cssText=`width:${z}px;height:${z}px`;s.innerHTML=`<svg width="${z}" height="${z}" viewBox="0 0 ${m.w} ${m.h}" style="display:block"><path fill="${f}" fill-rule="evenodd" d="${m.nd}"/></svg>`;r.append(s)})});
  syncOut();syncNums()}
function nodePts(){const s=S.body,sx=s.w/s.w0,sy=s.h/s.h0,c=new paper.Point(s.x+s.w/2,s.y+s.h/2),l=new paper.Point(PIVOT.x,PIVOT.y-S.spread-44);
  return s.nodes.map(n=>{let q=new paper.Point(s.x+n.p[0]*sx,s.y+n.p[1]*sy);if(s.rot)q=q.rotate(s.rot,c);q=q.add(new paper.Point(0,-S.spread));if(S.lean)q=q.rotate(S.lean,l);return q})}
function syncOut(){if($('out')&&last)$('out').value=last.svg}
function syncNums(){[['b',S.body],['c',S.cut]].forEach(([p,o])=>['x','y'].forEach(k=>{const r=$(p+k),n=$(p+k+'n');if(r&&document.activeElement!==n){r.value=o[k];n.value=rd(o[k])}}))}
function savePins(){try{localStorage.setItem('symbolPins',JSON.stringify(pins))}catch(_){}}
function drawPins(){const r=$('pins');r.innerHTML='';pins.forEach(p=>{const b=document.createElement('button');b.className='pin';b.setAttribute('aria-label','Open pinned version');b.append(thumb(p,'#F2F2F2'));b.onclick=()=>{S=JSON.parse(JSON.stringify(p));presetIdx=-1;panel();draw()};r.append(b)})}
/* Drag on any of the three pieces. The move is turned back into the top piece's frame. */
const st=$('stage');let drag=null;
function toUnits(e){const v=$('view'),p=v.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(v.getScreenCTM().inverse());return {x:q.x,y:q.y}}
st.onpointerdown=e=>{const u=toUnits(e),ang=Math.atan2(u.x,-u.y)*180/Math.PI,a=[0,120,-120].reduce((m,x)=>{const d=z=>Math.abs(((ang+z+540)%360)-180);return d(x)<d(m)?x:m},0);
  const pt=new paper.Point(u.x+PIVOT.x,u.y+PIVOT.y).rotate(a,new paper.Point(PIVOT.x,PIVOT.y));
  let hitNode=-1;if(construct&&S.body.type==='line'){nodePts().forEach((q,i)=>{if(q.getDistance(pt)<6)hitNode=i})}

  drag={u,a,o:target==='cut'?S.cut:S.body};st.setPointerCapture(e.pointerId);st.classList.add('drag');st.tabIndex=0;st.focus({preventScroll:true});presetIdx=-1;draw()};
st.onpointermove=e=>{if(!drag)return;const u=toUnits(e),r=drag.a*Math.PI/180,dx=u.x-drag.u.x,dy=u.y-drag.u.y;drag.u=u;

  drag.o.x=clamp(drag.o.x+dx*Math.cos(r)-dy*Math.sin(r),-120,120);drag.o.y=clamp(drag.o.y+dx*Math.sin(r)+dy*Math.cos(r),-120,160);requestAnimationFrame(draw)};
st.onpointerup=st.onpointercancel=()=>{drag=null;st.classList.remove('drag');document.querySelectorAll('.preset').forEach(b=>b.setAttribute('aria-pressed',false))};
st.tabIndex=0;st.setAttribute('aria-label','Symbol stage. Arrow keys move the selected shape.');
st.onkeydown=e=>{const k={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(!k)return;e.preventDefault();const o=target==='cut'?S.cut:S.body,m=e.shiftKey?5:.5;o.x+=k[0]*m;o.y+=k[1]*m;draw()};
$('tConstruct').onclick=e=>{construct=!construct;e.target.setAttribute('aria-pressed',construct);draw()};
$('tLight').onclick=e=>{light=!light;e.target.setAttribute('aria-pressed',light);st.classList.toggle('light',light);draw()};
try{const h=location.hash.slice(1);if(h){const v=JSON.parse(decodeURIComponent(atob(h)));if(v.body&&v.cut){S=v;presetIdx=-1}}}catch(_){}
try{pins=JSON.parse(localStorage.getItem('symbolPins')||'[]')}catch(_){pins=[]}
draw();panel();drawPins();
